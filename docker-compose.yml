services:
  backend:
    build: ./backend
    container_name: sdh-backend
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

# Le backend n'est exposé que sur 127.0.0.1 : pour un accès distant, placez un
# reverse proxy HTTPS (Caddy/Nginx) devant, voir README (déploiement VPS).
